<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Throughline</title>
    <meta name="description" content="Throughline support and privacy links.">
    <style>
      :root {
        color-scheme: light dark;
        --blue: #2563eb;
        --text: #111827;
        --muted: #6b7280;
        --bg: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text: #f9fafb;
          --muted: #9ca3af;
          --bg: #030712;
        }
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(42px, 9vw, 72px);
        line-height: 1;
        font-weight: 500;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 18px;
      }

      a {
        color: var(--blue);
        text-decoration: none;
        margin-right: 18px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>throughline</h1>
      <p>The quiet thread between what you said and what your AI does next.</p>
      <a href="./privacy/">Privacy policy</a>
      <a href="./support/">Support</a>
    </main>
  </body>
</html>
