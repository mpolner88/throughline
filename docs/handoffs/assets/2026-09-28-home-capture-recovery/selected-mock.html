<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capture recovery — selected design (tray) · Throughline handoff 2026-09-28</title>
<!--
  Frozen design target for docs/handoffs/2026-09-28-home-capture-recovery.md.
  Revision 2, 2026-09-28: adds the states required by Codex's feasibility review of revision 1
  (unconfirmed save, sign-in required, another account, stopped early, interrupted, no storage)
  and corrects the discard copy. States 1-12 are unchanged apart from the discard dialog (8).
  Design-only. Synthetic content. No production code.
  Gallery:            selected-mock.html
  One state, bare:    selected-mock.html?only=failed            (fills the viewport; used for reference screenshots)
  Dark appearance:    add &theme=dark (or ?theme=dark)
-->
<style>
  :root {
    --blue: #2563EB; --blue-lifted: #3B82F6;
    --pill-bg: #EFF6FF; --pill-text: #1E3A8C;
    --bg: #FFFFFF; --ink: #111114; --sec: #6E6E73;
    --border: rgba(17,17,20,0.14); --page: #F4F4F6; --danger: #C93A3A;
    --scrim: rgba(0,0,0,0.34);
  }
  [data-theme="dark"] {
    --pill-bg: rgba(59,130,246,0.16); --pill-text: #A9C4FF;
    --bg: #0E0E10; --ink: #F4F4F5; --sec: #9A9AA1;
    --border: rgba(244,244,245,0.16); --page: #050506; --danger: #E06C6C;
    --scrim: rgba(0,0,0,0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.gallery { padding: 44px 36px 96px; }
  body.bare { background: var(--bg); overflow: hidden; }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sec); }
  .eyebrow.blue { color: var(--blue); }
  .masthead { max-width: 860px; margin-bottom: 40px; display: flex; flex-direction: column; gap: 10px; }
  .masthead h1 { font-size: 32px; font-weight: 500; letter-spacing: -0.01em; }
  .masthead p { font-size: 15px; line-height: 1.55; color: var(--sec); }
  .theme-toggle { position: fixed; top: 18px; right: 22px; z-index: 50; font: 500 13px/1 -apple-system, sans-serif;
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); cursor: pointer; }
  .frames { display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start; }
  .frame { width: 390px; }
  .anno { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .anno h3 { font-size: 15px; font-weight: 600; }
  .anno p { font-size: 13px; line-height: 1.5; color: var(--sec); }

  .phone { background: var(--bg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .gallery .phone { width: 390px; height: 844px; border: 1px solid var(--border); border-radius: 44px; }
  .bare .phone { width: var(--w, 390px); height: var(--h, 844px); }
  .statusbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 10px 34px 0; font-size: 15px; font-weight: 600; }
  .statusbar .right { font-size: 12px; letter-spacing: 2px; }
  .topbar { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 20px 24px 14px; }
  .wordmark { font-size: 21px; font-weight: 500; letter-spacing: -0.01em; border-bottom: 3px solid var(--blue);
    padding-bottom: 3px; line-height: 1.1; }
  .gear { font-size: 18px; opacity: 0.85; }
  .content { flex: 1; overflow: hidden; padding: 8px 24px 0; display: flex; flex-direction: column; gap: 22px; }
  .dateblock { display: flex; flex-direction: column; gap: 10px; }
  .datetext { font-size: 16px; font-weight: 500; }
  .h-plan { font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  .lede { font-size: 15px; line-height: 1.55; color: var(--sec); }
  .section { display: flex; flex-direction: column; gap: 8px; }
  .task-row { display: flex; align-items: flex-start; gap: 10px; border: 0.7px solid var(--border);
    border-radius: 8px; padding: 12px 11px; }
  .task-circle { width: 20px; height: 20px; border-radius: 50%; border: 1.8px solid var(--sec); flex: none; margin-top: 1px; }
  .task-text { font-size: 15px; font-weight: 500; line-height: 1.35; }
  .task-meta { font-size: 12px; color: var(--sec); margin-top: 3px; }
  .plain-row { display: flex; align-items: center; gap: 14px; min-height: 58px; font-size: 15px; border-bottom: 0.5px solid var(--border); }
  .plain-row:last-child { border-bottom: 0; }
  .plain-row .task-circle { border-color: var(--blue); margin-top: 0; }
  .card { border: 0.7px solid var(--border); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 13px; }
  .card .title { font-size: 19px; font-weight: 500; margin-top: 6px; }
  .prose { font-size: 14px; line-height: 1.5; color: var(--sec); }
  .mini-item { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; }
  .mini-circle { width: 16px; height: 16px; border: 1.6px solid var(--sec); border-radius: 50%; flex: none; margin-top: 1px; }
  .duration { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

  .tray { flex: none; border-top: 0.5px solid var(--border); background: var(--bg); }
  .tray-head { padding: 10px 24px 0; }
  .tray-head.with-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 2px; }
  .btn.text { color: var(--blue); padding: 10px 0 10px 14px; }
  .tray-row { display: flex; align-items: center; gap: 10px; padding: 12px 24px; min-height: 48px; }
  .tray-row + .tray-row { border-top: 0.5px solid var(--border); }
  .tray-row .state { flex: 1; font-size: 13px; font-weight: 500; color: var(--sec); line-height: 1.4; }
  .tray-row .state strong { color: var(--ink); font-weight: 500; }
  .tray-row .duration { font-size: 13px; color: var(--ink); flex: none; }
  .tray-row.more { color: var(--blue); font-size: 13px; font-weight: 500; justify-content: space-between; }
  .tray-actions { display: flex; gap: 8px; padding: 0 24px 12px 58px; flex-wrap: wrap; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid color-mix(in srgb, var(--sec) 30%, transparent); border-top-color: var(--sec); }
  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: none; margin: 3px; }
  .ring { width: 12px; height: 12px; border-radius: 50%; border: 1.8px solid var(--sec); flex: none; margin: 1px; }
  .glyph { width: 14px; text-align: center; color: var(--sec); font-size: 13px; flex: none; }
  .glyph.warn { color: var(--danger); font-weight: 600; }
  .btn { font-size: 13px; font-weight: 500; padding: 10px 14px; min-height: 44px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.outline { border: 0.7px solid var(--border); color: var(--ink); }
  .btn.quiet { color: var(--sec); }

  .recorder { flex: none; padding: 12px 24px 22px; display: flex; flex-direction: column; gap: 9px; background: var(--bg); }
  .recorder.lined { border-top: 0.5px solid var(--border); }
  .rec-btn { border-radius: 8px; color: #fff; text-align: center;
    background: linear-gradient(150deg, var(--blue-lifted), var(--blue) 62%);
    box-shadow: 0 6px 14px rgba(37,99,235,0.16); border: 1px solid rgba(255,255,255,0.22);
    padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 7px;
    min-height: 92px; justify-content: center; }
  .rec-mark { display: flex; gap: 18px; align-items: center; height: 24px; }
  .rec-mark span { width: 34px; height: 5px; border-radius: 3px; background: #fff; display: block; }
  .rec-ring { width: 34px; height: 34px; border-radius: 50%; border: 5px solid #fff; border-top-color: transparent; }
  .rec-title { font-size: 16px; font-weight: 500; }
  .rec-timer { font-size: 28px; font-weight: 600; font-family: ui-rounded, -apple-system, sans-serif; font-variant-numeric: tabular-nums; }
  .rec-support { font-size: 13px; opacity: 0.86; }
  .rec-chip { background: #fff; color: var(--blue); margin-top: 4px; }

  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 10px; right: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sheet-group { border-radius: 14px; overflow: hidden; background: var(--bg); }
  .sheet-title { padding: 14px 16px 4px; text-align: center; font-size: 13px; font-weight: 600; color: var(--sec); }
  .sheet-msg { padding: 0 16px 14px; text-align: center; font-size: 13px; color: var(--sec); border-bottom: 0.5px solid var(--border); line-height: 1.4; }
  .sheet-btn { padding: 16px; text-align: center; font-size: 17px; }
  .sheet-btn.destructive { color: var(--danger); }
  .sheet-btn.cancel { background: var(--bg); border-radius: 14px; font-weight: 600; }

  .ax .tray-row .state, .ax .tray-row .duration { font-size: 20px; }
  .ax .btn { font-size: 21px; padding: 14px 16px; }
  .ax .eyebrow { font-size: 16px; }
  .ax .datetext, .ax .rec-title { font-size: 24px; }
  .ax .tray-actions { flex-direction: column; align-items: stretch; padding-left: 24px; }
  .ax .tray-row { align-items: flex-start; }
  .ax .glyph { font-size: 20px; }
  .ax .tray-head.with-action { flex-direction: column; align-items: stretch; gap: 0; padding-top: 10px; }
  .ax .btn.text { justify-content: flex-start; padding-left: 0; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var Q = new URLSearchParams(location.search);
  if (Q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';

  function statusbar(air) {
    return '<div class="statusbar"><span>9:41</span><span class="right">' + (air ? '✈' : '▲▲▲ ᯤ ▮') + '</span></div>';
  }
  var TOPBAR = '<div class="topbar"><div class="wordmark">throughline</div><div class="gear">⚙</div></div>';
  var DATE = '<div class="dateblock"><div class="eyebrow">today</div><div class="datetext">Monday, September 28</div></div>';
  function task(text, meta) {
    return '<div class="task-row"><div class="task-circle"></div><div><div class="task-text">' + text + '</div><div class="task-meta">' + meta + '</div></div></div>';
  }
  var PLAN = DATE + '<div class="h-plan">Today’s plan</div><div class="section"><div class="eyebrow">most important</div>'
    + task('Ship the small thing first', 'ship the small thing · 6:11 PM')
    + task('Walk again tonight', 'ship the small thing · 6:11 PM') + '</div>';
  var ARRIVED = DATE + '<div class="h-plan">Today’s plan</div><div class="section"><div class="eyebrow">most important</div>'
    + task('Call the landlord about the lease', 'lease and errands · 6:42 PM')
    + task('Ship the small thing first', 'ship the small thing · 6:11 PM') + '</div>'
    + '<div class="card"><div><div class="eyebrow">freeform · 6:42 PM</div><div class="title">lease and errands</div></div>'
    + '<div class="section"><div class="eyebrow">most important</div><div class="mini-item"><div class="mini-circle"></div>Call the landlord about the lease</div></div>'
    + '<div class="prose">Call the landlord about the lease before Friday, then pick up the package on the way home.</div></div>';
  var EMPTY = DATE + '<div class="section" style="gap:14px"><div class="h-plan">Say today’s to-dos.</div>'
    + '<div class="lede">Speak naturally. Throughline turns your voice note into a clear, organized task list.</div></div>'
    + '<div class="section"><div class="eyebrow">what you’ll get</div><div>'
    + '<div class="plain-row"><div class="task-circle"></div>Ship the small thing first</div>'
    + '<div class="plain-row"><div class="task-circle"></div>Walk again tonight</div></div></div>';

  var ICON = {
    live: '<span class="dot-live"></span>',
    spin: '<span class="spinner"></span>',
    hold: '<span class="ring"></span>',
    warn: '<span class="glyph warn">!</span>'
  };
  function row(icon, dur, bold, rest) {
    return '<div class="tray-row">' + ICON[icon] + '<span class="duration">' + dur + '</span><span class="state"><strong>' + bold + '</strong> ' + rest + '</span></div>';
  }
  function actions(playLabel) {
    return '<div class="tray-actions"><div class="btn primary">Save again</div><div class="btn outline">' + playLabel + '</div><div class="btn quiet">Discard</div></div>';
  }
  function tray(inner, head, headAction) {
    var headHTML = '';
    if (head && headAction) {
      headHTML = '<div class="tray-head with-action"><div class="eyebrow">' + head + '</div><div class="btn text">' + headAction + '</div></div>';
    } else if (head) {
      headHTML = '<div class="tray-head"><div class="eyebrow">' + head + '</div></div>';
    }
    return '<div class="tray">' + headHTML + inner + '</div>';
  }
  function singleAction(label, kind) {
    return '<div class="tray-actions"><div class="btn ' + (kind || 'outline') + '">' + label + '</div></div>';
  }
  var REC_IDLE = '<div class="rec-btn"><div class="rec-mark"><span></span><span></span></div><div class="rec-title">Start recording</div></div>';
  var REC_FIRST = '<div class="rec-btn"><div class="rec-mark"><span></span><span></span></div><div class="rec-title">Record today’s plan</div></div>';
  var REC_LIVE = '<div class="rec-btn" style="padding:22px 16px;gap:8px"><div class="rec-ring"></div><div class="rec-title">Stop recording</div><div class="rec-timer">0:18 / 5:00</div><div class="rec-support">Listening… Tap when you’re done</div></div>';
  var REC_PERM = '<div class="rec-btn"><div class="rec-title">Microphone access is off</div><div class="rec-support">Turn it on in Settings to record. Your notes are unaffected.</div><div class="btn rec-chip">Open Settings</div></div>';
  var REC_STORAGE = '<div class="rec-btn"><div class="rec-mark"><span></span><span></span></div><div class="rec-title">Not enough space to record</div><div class="rec-support">Free up storage on this phone, then try again. Your notes are unaffected.</div></div>';
  function recorder(inner, lined) { return '<div class="recorder' + (lined ? ' lined' : '') + '">' + inner + '</div>'; }
  function sheet(title, msg, action) {
    return '<div class="scrim"></div><div class="sheet"><div class="sheet-group"><div class="sheet-title">' + title + '</div>'
      + '<div class="sheet-msg">' + msg + '</div>'
      + '<div class="sheet-btn destructive">' + action + '</div></div><div class="sheet-btn cancel">Cancel</div></div>';
  }
  // Known local-only: no request for this capture has left the phone, or the account has confirmed it holds nothing for it.
  var DISCARD = sheet('Discard this capture?',
    'The audio will be deleted from this phone. It hasn’t been saved to your account.', 'Discard from phone');
  // Unconfirmed: a request left the phone and no validated receipt came back.
  var DISCARD_UNCONFIRMED = sheet('Discard this capture?',
    'This deletes the audio from this phone only. If it already reached your account, the note will still appear in your list.', 'Discard from phone');

  var FAILED_ROW = row('warn', '0:42', 'Couldn’t save.', 'Still on your phone.');
  var UNCONFIRMED_ROW = row('warn', '0:42', 'Couldn’t confirm the save.', 'Still on your phone.');
  var SIGNIN_ROWS = row('hold', '1:12', 'On your phone.', 'Waiting for sign-in.') + row('hold', '0:42', 'On your phone.', 'Waiting for sign-in.');

  var STATES = [
    { id: 'kept', title: '1 · Stopped: kept on the phone, saving',
      note: 'Appears the moment recording stops. The recorder is already free.',
      body: PLAN, tray: tray(row('live', '0:42', 'On your phone.', 'Saving to your account…')), rec: REC_IDLE },
    { id: 'saved', title: '2 · Saved to the account, structuring',
      note: 'The bold clause is always the durable fact.',
      body: PLAN, tray: tray(row('spin', '0:42', 'Saved to your account.', 'Structuring your note…')), rec: REC_IDLE },
    { id: 'recording', title: '3 · Recording again while the last capture structures',
      note: 'Tray copy compresses while the recorder is expanded.',
      body: PLAN, tray: tray(row('spin', '0:42', 'Saved.', 'Structuring…')), rec: REC_LIVE },
    { id: 'arrived', title: '4 · Structured: the tray is gone',
      note: 'The note arrives in the plan exactly as notes appear today. Nothing else is added.',
      body: ARRIVED, tray: '', rec: REC_IDLE, lined: true },
    { id: 'offline', title: '5 · Offline: a calm queue', air: true,
      note: 'No alarm color. Saving resumes on its own, oldest first.',
      body: PLAN, tray: tray(row('hold', '1:12', 'On your phone.', 'Waiting for connection.') + row('hold', '0:42', 'On your phone.', 'Waiting for connection.'),
        '2 captures waiting to save'), rec: REC_IDLE },
    { id: 'failed', title: '6 · Save failed: recovery',
      note: 'The row stays until it is saved or discarded.',
      body: PLAN, tray: tray(FAILED_ROW + actions('▶ Play')), rec: REC_IDLE },
    { id: 'playing', title: '7 · Replaying the capture',
      note: 'Play becomes Stop while the audio plays.',
      body: PLAN, tray: tray(FAILED_ROW + actions('■ Stop')), rec: REC_IDLE },
    { id: 'discard', title: '8 · Discard confirmation, never sent',
      note: 'Native confirmation. Used only when no request for this capture has left the phone. Discard deletes the phone’s copy; it is not account deletion.',
      body: PLAN, tray: tray(FAILED_ROW + actions('▶ Play')), rec: REC_IDLE, overlay: DISCARD },
    { id: 'many', title: '9 · More than three captures', air: true,
      note: 'The last row is a button that shows every capture.',
      body: PLAN, tray: tray(row('hold', '2:05', 'On your phone.', 'Waiting for connection.') + row('hold', '1:12', 'On your phone.', 'Waiting for connection.')
        + row('hold', '0:42', 'On your phone.', 'Waiting for connection.') + '<div class="tray-row more"><span>+ 2 more</span><span>Show all</span></div>',
        '5 captures waiting to save'), rec: REC_IDLE },
    { id: 'first', title: '10 · First recording on an empty Home',
      note: 'The empty Home stays as it is today while the first capture saves.',
      body: EMPTY, tray: tray(row('live', '0:42', 'On your phone.', 'Saving to your account…')), rec: REC_FIRST },
    { id: 'permission', title: '11 · Microphone access is off',
      note: 'The recorder explains and carries the one useful action.',
      body: PLAN, tray: '', rec: REC_PERM, lined: true },
    { id: 'ax', title: '12 · Accessibility text size', ax: true,
      note: 'Text wraps, actions stack, nothing truncates.',
      body: DATE, tray: tray(row('warn', '4:58', 'Couldn’t save.', 'Still on your phone.') + actions('▶ Play')), rec: REC_IDLE },
    { id: 'checking', title: '13 · Sent, answer lost: checking',
      note: 'A request left the phone and no receipt came back. The app asks again with the same capture before claiming anything.',
      body: PLAN, tray: tray(row('live', '0:42', 'On your phone.', 'Checking with your account…')), rec: REC_IDLE },
    { id: 'unconfirmed', title: '14 · Couldn’t confirm the save',
      note: 'The account may already hold it. Save again is safe: it can only return the same note.',
      body: PLAN, tray: tray(UNCONFIRMED_ROW + actions('▶ Play')), rec: REC_IDLE },
    { id: 'discard-unconfirmed', title: '15 · Discard confirmation, unconfirmed',
      note: 'Says only what is known. Discard never deletes anything from the account.',
      body: PLAN, tray: tray(UNCONFIRMED_ROW + actions('▶ Play')), rec: REC_IDLE, overlay: DISCARD_UNCONFIRMED },
    { id: 'signin', title: '16 · Sign in to save',
      note: 'The account rejected this phone’s sign-in. The audio stays here and saves only to the same account.',
      body: PLAN, tray: tray(SIGNIN_ROWS, '2 captures waiting to save', 'Sign in'), rec: REC_IDLE },
    { id: 'other', title: '17 · Captures from another account',
      note: 'Never played, listed or saved under the account now signed in. Recommended default; Mike confirms.',
      body: PLAN, tray: tray(row('hold', '', '2 captures from another account.', 'Sign in to that account to save them.') + singleAction('Discard from phone', 'quiet')), rec: REC_IDLE },
    { id: 'early', title: '18 · Stopped early, kept',
      note: 'A call, leaving the app, or full storage ended the recording. What was recorded is kept and saved.',
      body: PLAN, tray: tray(row('live', '0:42', 'On your phone.', 'Stopped early. Saving to your account…')), rec: REC_IDLE },
    { id: 'interrupted', title: '19 · Interrupted, nothing recoverable',
      note: 'Told once, plainly. The duration is blank when it is not known. The row stays until dismissed.',
      body: PLAN, tray: tray(row('warn', '', 'Recording interrupted.', 'The audio couldn’t be recovered.') + singleAction('Dismiss')), rec: REC_IDLE },
    { id: 'storage', title: '20 · Not enough space to record',
      note: 'Recording does not start until the phone can hold it. Tapping again re-checks.',
      body: PLAN, tray: '', rec: REC_STORAGE, lined: true },
    { id: 'ax-signin', title: '21 · Sign in at accessibility text size', ax: true,
      note: 'The header action drops below its label. Nothing truncates.',
      body: DATE, tray: tray(SIGNIN_ROWS, '2 captures waiting to save', 'Sign in'), rec: REC_IDLE }
  ];

  function phone(s) {
    return '<div class="phone' + (s.ax ? ' ax' : '') + '">' + statusbar(s.air) + TOPBAR
      + '<div class="content">' + s.body + '</div>' + s.tray + recorder(s.rec, s.lined) + (s.overlay || '') + '</div>';
  }

  var app = document.getElementById('app');
  var only = Q.get('only');
  if (only) {
    document.body.className = 'bare';
    document.documentElement.style.setProperty('--w', (parseInt(Q.get('w'), 10) || 390) + 'px');
    document.documentElement.style.setProperty('--h', (parseInt(Q.get('h'), 10) || 844) + 'px');
    var s = STATES.filter(function (x) { return x.id === only; })[0];
    app.innerHTML = s ? phone(s) : '<p style="padding:24px">Unknown state: ' + only + '</p>';
    return;
  }
  document.body.className = 'gallery';
  app.innerHTML = '<button class="theme-toggle" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme===\'dark\'?\'\':\'dark\'">Light / Dark</button>'
    + '<header class="masthead"><div class="eyebrow blue">TL-CAP-001 · selected design · frozen 2026-09-28 · design-only · synthetic content</div>'
    + '<h1>Capture recovery: the recorder holds it</h1>'
    + '<p>Nothing leaves the recorder until it is safe. Each capture docks in a one-line tray above the record button and moves into Today’s plan only as a finished note. These twenty-one states are the target for the first slice. Revision 2 adds states 13–21 and corrects the discard wording in state 8.</p></header>'
    + '<div class="frames">' + STATES.map(function (s) {
      return '<div class="frame" id="' + s.id + '">' + phone(s) + '<div class="anno"><h3>' + s.title + '</h3><p>' + s.note + '</p></div></div>';
    }).join('') + '</div>';
})();
</script>
</body>
</html>
