  let html = `<header class="masthead"><span class="eyebrow">TL-KNOW-001 · selected by Mike, 2026-10-05 · pending Codex feasibility review</span><h1>Categories and search: an index that writes itself</h1>
    <p>Candidate B, frozen for the handoff. Notes opens on an index of the people, projects and topics you keep coming back to. Each one is a page with its open to-dos and every place you said it. One search covers notes and to-dos. Synthetic content throughout. The handoff document is the contract; this page illustrates it.</p></header><div class="frames">`;
  Object.entries(FRAMES).forEach(([id, f]) => {
    html += `<div class="frame">${f.html}<div class="anno"><h3>${f.t}<code>${id}</code></h3><p>${f.d}</p></div></div>`;
  });
  document.getElementById('root').innerHTML = html + '</div>';
}
</script>
