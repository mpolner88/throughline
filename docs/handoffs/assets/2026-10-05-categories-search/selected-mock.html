  .mpill { background: var(--muted-bg); color: var(--sec); border-radius: 5px; padding: 1px 6px; font-size: calc(11.5px * var(--s)); }
    .dots { width: 44px; height: 44px; margin: -8px -12px -8px 0; flex: none; color: var(--sec); display: flex; align-items: center; justify-content: center; font-size: 18px; letter-spacing: 1px; }

  .nrow .ntitle { font-size: calc(17px * var(--s)); font-weight: 500; flex: 1; min-width: 0; }

  .chev { color: var(--sec); flex: none; }

  .ptitle { font-size: calc(28px * var(--s)); font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; margin: 6px 0 6px; }
  .psub { font-size: calc(14px * var(--s)); color: var(--sec); line-height: 1.45; margin-bottom: 14px; }
  .links { font-size: calc(14px * var(--s)); color: var(--sec); line-height: 1.5; margin: 2px 0 14px; }
  .links a { color: var(--blue); text-decoration: none; font-weight: 500; position: relative; }

  .vstat { font: 500 12px ui-monospace, Menlo, monospace; color: var(--sec); }

</style>

// The shipped Edit form, abbreviated: the illustration omits most important and the transcript field. "about"
// sits after the to-dos editor and before the transcript. Kinds are the global kinds (rule 5).
// mode: 'edit' (a removal staged, Undo until Save), 'locked' (a Private Evaluation note after its refused Save), or
// 'unconfirmed' (the shipped frozen state after a save whose outcome is unknown).
const FOOT = {
  edit: 'Chosen from what you said. Removing one takes this note off that page, here and for your agent.',
  locked: 'Chosen from what you said. Labels on this note can’t be removed.',
  unconfirmed: 'Chosen from what you said. Removing one takes this note off that page, here and for your agent.',
};
function editSheet(n, removed, mode = 'edit') {
  const rk = removed ? labelKey(removed) : '';
  const rows = noteLabels(n, SUP).map(x => {
    const kind = kindOne(GK.get(x.k));
    if (x.k === rk) return `<div class="frow removed"><span class="lbl"><s>${esc(x.l)}</s><small>${kind} · removed</small></span><button class="undo" aria-label="Undo removing ${esc(x.l)}"${mode === 'unconfirmed' ? ' disabled' : ''}>Undo</button></div>`;
    return `<div class="frow"><span class="lbl">${esc(x.l)}<small>${kind}</small></span>${mode === 'locked' ? '' : `<button class="act" aria-label="Remove ${esc(x.l)}">Remove</button>`}</div>`;
  }).join('');
  const frozen = mode === 'unconfirmed';
  const fields = `<span class="eyebrow">title</span><div class="fieldbox ghost">${esc(n.title)}</div><span class="eyebrow">summary</span><div class="fieldbox ghost" style="min-height:64px">${esc(n.summary)}</div>
  <span class="eyebrow">to-dos</span>${n.todos.map(t => `<div class="fieldbox ghost">${esc(t.t)}</div>`).join('')}
  <span class="eyebrow" style="margin-top:6px">about</span><div class="form-sect">${rows}</div><p class="foot">${FOOT[mode]}</p>`;
  return `<div class="scrim"></div><div class="sheet"><div class="sh-head"><button class="pillbtn">${frozen ? 'Close' : 'Cancel'}</button><span class="ttl">Edit note</span><button class="pillbtn" style="color:var(--blue);font-weight:500">Save</button></div>
  <div class="sh-body">${frozen ? '<p class="err">Couldn\'t confirm the save. Tap Save to try again.</p><div class="frozen">' + fields + '</div>' : mode === 'locked' ? '<p class="err">Couldn\'t save your change. Try again.</p>' + fields : fields}${mode === 'locked' ? '<a class="privacy">How we treat recordings</a>' : ''}</div></div>`;
}
// The shipped note card, unchanged except that its eyebrow gains the date in the running list's format.
function card(n, { processing = '' } = {}) {
  const open = n.todos.filter(t => !t.done).slice(0, 3);
  return `<div class="card"><div class="head"><div class="t"><span class="eyebrow">${esc(n.type)} · ${esc(n.src)}</span><h4>${esc(n.title)}</h4></div><button class="trash" aria-label="Discard memory">${ICON.trash}</button></div>
    ${processing ? `<div class="pstatus"><span class="spin"></span>${esc(processing)}</div>` : ''}
    ${open.length ? `<span class="eyebrow">to-dos</span>${open.map(t => `<div class="mini"><i></i>${esc(t.t)}</div>`).join('')}` : ''}
    <p class="pv">${esc(n.said.charAt(0).toUpperCase() + n.said.slice(1))}.</p></div>`;
}

/* ---------- frames ---------- */
// `ill` marks a static illustration: the frame shows a state that this script does not simulate.
const FRAMES = {};
const F = (id, t, d, html, ill = false) => { FRAMES[id] = { t, d, html, ill }; };

F('index', 'Index', 'Notes opens on an index built from what you said: people, projects and topics that come up in two or more notes, newest first, with the note count. All notes is one row down.',
  phone(nav() + scroll(field() + indexBody(INDEX, NOTES.length))));
F('index-long', 'Index with more history', 'Each section shows its first five entries, then the shipped Show and Hide control. Long labels wrap. Synthetic, larger history.',
  phone(nav() + scroll(field() +
    sect('people') + [['Sam', 'today', 6], ['Mom', 'today', 4], ['Marcus', 'Fri', 3], ['Priya', 'Sep 26', 2], ['Dana', 'Sep 18', 3]].map(([l, d, c]) => irow({ l, lastDay: d, ids: { length: c } })).join('') +
    '<button class="morerow"><span>2 more people</span><span class="show">Show</span></button>' +
    sect('projects') + [['pricing page', 'today', 5], ['launch email', 'today', 4], ['the Boston trip with the whole team', 'Sep 18', 3]].map(([l, d, c]) => irow({ l, lastDay: d, ids: { length: c } })).join('') +
    sect('topics') + [['health', 'today', 7], ['family', 'today', 5]].map(([l, d, c]) => irow({ l, lastDay: d, ids: { length: c } })).join(''))), true);
F('results', 'Typing “sam”', 'One search: matching index entries first, then to-dos (the running-list row, so completion still works), then notes. While the software keyboard is up and nothing is recording, the whole bottom region (tray, notices and recorder) is hidden.',
  phone(nav() + scroll(field({ q: 'sam', focus: true, cancel: true }) + results('sam')), { kbd: true }));
F('once', 'A label said once', 'Tapping a label that is not in the index opens search with that label as the query. Here nothing is in the index, so results start with to-dos.',
  phone(nav() + scroll(field({ q: 'Marcus', cancel: true }) + results('Marcus'))));
F('page', 'A page', 'An entry’s page: kind, count and span, what it comes up with, the open to-dos that name it, and every place you said it, newest first. Each place is one button. Each related name is its own button, with a 44-point square natively.',
  phone(nav() + scroll(page('pricing page'))));
F('page-quiet', 'A page with no open to-dos', 'While this visit has no to-do to show, that section is left out; a to-do that qualifies later adds it. When the transcript never says the word, the summary line is shown without quotes.',
  phone(nav() + scroll(page('health'))));
F('all-notes', 'All notes', 'Today’s Notes list, unchanged, one level down. Each card’s eyebrow now carries the date, in the running list’s format.',
  phone(nav() + scroll(`<h1 class="ptitle" style="margin-top:2px">all notes</h1><p class="psub">${NOTES.length} notes</p>` + card(N.n1) + card(N.n3))));
F('note', 'Note: what it’s about', 'The note sheet gains one quiet line under the title. A label with a page opens it; a label said once opens a search.',
  phone(nav() + scroll('') + sheet(N.n1), { rec: false }));
F('edit', 'Correcting a label', 'Edit gains an “about” section after the to-dos and before the transcript. Remove is staged with Undo and goes with Save in the same transaction. Removing “pricing page” also keeps the folded “pricing” from appearing. Nothing asks you to add labels.',
  phone(nav() + scroll('') + editSheet(N.n1, 'pricing page'), { rec: false }), true);
F('edit-locked', 'Labels that can’t be removed', 'A note linked to Private Evaluation, after Save. The shipped Edit form still opens, and the server refuses its Save for these notes, so the shipped message shows and the form stays editable. This revision adds no save route. Its labels are listed without Remove, the foot says so, and the shipped privacy link stays. Making these notes editable is separate scope for Mike.',
  phone(nav() + scroll('') + editSheet(N.n3, '', 'locked'), { rec: false }), true);
F('edit-unconfirmed', 'Save not confirmed', 'The shipped frozen state after a save whose outcome is unknown, with a removal in it. Fields are read-only, Close replaces Cancel, and Save retries the same request. It survives relaunch.',
  phone(nav() + scroll('') + editSheet(N.n1, 'pricing page', 'unconfirmed'), { rec: false }), true);
F('thin', 'Early days', 'Until something comes up twice, the index says so plainly and all notes is one row down.',
  phone(nav() + scroll(field() + `<div class="empty" style="margin-top:12px"><span class="line"></span><h3>Nothing has come up twice yet.</h3><p>When a person, project or topic appears in two notes, it gets its own page here.</p></div>` + allNotesRow(3))));
F('empty', 'No notes yet', 'With no notes there is nothing to search, so Notes keeps the shipped line and no field.',
  phone(nav() + scroll('<p class="plain">Your notes will appear here.</p>')));
F('none', 'No results', 'Plain words about where search looked. The field stays focused so the next try is one edit away.',
  phone(nav() + scroll(field({ q: 'dentst', focus: true, cancel: true }) + noResults('dentst')), { kbd: true }));
F('search-recording', 'Searching while recording', 'While a recording is being prepared, recorded or finished, the field can’t take focus, so the keyboard never covers Stop. The index and pages still work. Any query is kept; focus is never moved into the field when recording ends.',
  phone(nav() + scroll(field({ paused: true }) + indexBody(INDEX, NOTES.length)), { rec: 'live' }), true);
F('loading', 'Still loading', 'After sign-in, the index and search use the notes that have arrived and say so. Counts are provisional until loading completes. The index grows as the rest load.',
  phone(nav() + scroll(field() + banner('loading') + indexBody(indexOf(['n1', 'n2', 'n3', 'n5', 'n7'].map(i => N[i])), 5))), true);
F('offline', 'Offline', 'The index, pages and search are built on the phone from notes already there, so they keep working.',
  phone(nav() + scroll(field() + banner('offline') + indexBody(INDEX, NOTES.length))), true);
F('error', 'Refresh failed', 'With notes on the phone: the same as offline, with its own line and a Try again button. Pull to refresh also retries.',
  phone(nav() + scroll(field() + banner('error') + indexBody(INDEX, NOTES.length))), true);
F('error-empty', 'Refresh failed, nothing on the phone', 'With no cached notes, including an empty cache while offline, Notes shows the shipped message, no field, and Try again; pull to refresh also retries. A retry that fails keeps this state. Only a load that finishes with no notes shows “Your notes will appear here.”',
  phone(nav() + scroll('<p class="plain">Couldn\'t refresh your notes. Pull down to try again.</p><button class="plain-retry">Try again</button>')), true);
F('processing', 'A note still processing', 'The shipped card and status line. Until processing finishes, a note has no labels, is not counted in the index and matches search by its title only. Failed notes behave the same.',
  phone(nav() + scroll(`<h1 class="ptitle" style="margin-top:2px">all notes</h1><p class="psub">${NOTES.length + 1} notes</p>` +
    card({ type: 'freeform', src: '9:38 AM', title: 'voice note', todos: [], said: 'synthetic transcript for design review' }, { processing: 'Waiting for extraction' }) + card(N.n1))), true);

/* ---------- render ---------- */
if (ONLY && FRAMES[ONLY]) {
  document.body.className = 'bare' + (AX ? ' ax' : '');
  document.getElementById('root').innerHTML = FRAMES[ONLY].html;
} else {
  document.body.className = 'gallery' + (AX ? ' ax' : '');
  const t = document.getElementById('themeToggle'); t.hidden = false;
  t.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
  t.onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; t.textContent = d.dataset.theme === 'dark' ? 'Light' : 'Dark'; };
  const failed = VECTORS.filter(v => !v.ok);
  let html = `<header class="masthead"><span class="eyebrow">TL-KNOW-001 · selected by Mike, 2026-10-05 · revision 4 · handoff ready</span><h1>Categories and search: an index that writes itself</h1>
    <p>Candidate B, frozen for the handoff. Notes opens on an index of the people, projects and topics you keep coming back to. Each one is a page with its open to-dos and every place you said it. One search covers notes and to-dos. Synthetic content throughout. The handoff document is the contract; this page illustrates it. The rules section of this script is executable and checked against the rule vectors below; frames marked “static illustration” show a state the script does not simulate.</p>
    <span class="vstat${failed.length ? ' bad' : ''}">Rule vectors: ${VECTORS.length - failed.length}/${VECTORS.length} pass${failed.length ? ' · failing: ' + failed.map(v => esc(v.name)).join('; ') : ''}</span></header><div class="frames">`;
  Object.entries(FRAMES).forEach(([id, f]) => {
    html += `<div class="frame">${f.html}<div class="anno"><h3>${f.t}<code>${id}</code>${f.ill ? '<span class="ill">static illustration</span>' : ''}</h3><p>${f.d}</p></div></div>`;
  });
  document.getElementById('root').innerHTML = html + '</div>';
}
</script>
</body>
</html>
