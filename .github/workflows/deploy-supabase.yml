name: Deploy Supabase functions

# Manual deploy of the api and mcp Edge Functions. Needs the repository
# secret SUPABASE_ACCESS_TOKEN (create one at
# https://supabase.com/dashboard/account/tokens). Dispatch from the branch
# whose code should ship; scripts/deploy-supabase.mjs runs the extraction
# contract check before deploying.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not set as a repository secret." >&2
            echo "Create a token at https://supabase.com/dashboard/account/tokens" >&2
            echo "and add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
      - name: Contract check
        run: npm run contract:check
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy api and mcp
        run: node scripts/deploy-supabase.mjs
