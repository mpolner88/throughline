<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories and search — candidates</title>
<!--
  Design candidates for TL-KNOW-001, categories and search across notes and to-dos.
  Design-only. Synthetic content. No production code. Nothing here is selected until Mike chooses.
  Gallery:          candidates.html
  One frame, bare:  candidates.html?only=a-library      (fills the viewport; used for reference renders)
  Dark appearance:  &theme=dark       Larger text: &ax=1       Other phone: &w=375&h=667
  Frame ids are listed in FRAMES below.
-->
<style>
  :root {
    --blue: #2563EB; --blue-lifted: #3B82F6;
    --pill-bg: #EFF6FF; --pill-text: #1E3A8C;
    --bg: #FFFFFF; --ink: #111114; --sec: #6E6E73;
    --border: rgba(17,17,20,0.14); --page: #F4F4F6; --danger: #C93A3A;
    --muted-bg: #F2F2F4; --scrim: rgba(0,0,0,0.34); --kbd: #D1D3D9; --key: #FFFFFF;
    --s: 1;
  }
  [data-theme="dark"] {
    --blue: #3B82F6;
    --pill-bg: rgba(59,130,246,0.18); --pill-text: #B9D0FF;
    --bg: #0E0E10; --ink: #F4F4F5; --sec: #9A9AA1;
    --border: rgba(244,244,245,0.16); --page: #050506; --danger: #E06C6C;

  }
  body.ax { --s: 1.35; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body.gallery { padding: 44px 36px 96px; }
  body.bare { background: var(--bg); overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

  /* gallery chrome */
  .eyebrow { font-size: calc(11px * var(--s)); font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sec); }
  .masthead { max-width: 940px; margin-bottom: 30px; display: flex; flex-direction: column; gap: 10px; }
  .masthead h1 { font-size: 32px; font-weight: 500; letter-spacing: -0.01em; }
  .masthead p, .doc p { font-size: 15px; line-height: 1.55; color: var(--sec); }
  .doc { max-width: 940px; margin: 0 0 34px; border: 0.7px solid var(--border); border-radius: 8px; background: var(--bg); padding: 18px 22px; display: grid; gap: 10px; }
  .doc h2 { font-size: 16px; font-weight: 600; }
  .doc li { font-size: 13.5px; line-height: 1.55; color: var(--sec); margin-left: 18px; }
  .doc li strong, .doc p strong { color: var(--ink); font-weight: 500; }
  .doc table { border-collapse: collapse; font-size: 13px; line-height: 1.45; width: 100%; }
  .doc th, .doc td { text-align: left; vertical-align: top; padding: 8px 10px; border-top: 0.7px solid var(--border); }
  .doc th { font-weight: 600; color: var(--ink); }
  .doc td { color: var(--sec); }
  .doc td a, .doc li a { color: var(--blue); text-decoration: none; }
  .current { display: flex; gap: 20px; flex-wrap: wrap; }
  .current figure { width: 250px; }
  .current img { width: 250px; border: 0.7px solid var(--border); border-radius: 22px; display: block; }
  .current figcaption { font-size: 12.5px; line-height: 1.45; color: var(--sec); margin-top: 8px; }
  .theme-toggle { position: fixed; top: 18px; right: 22px; z-index: 50; font: 500 13px/1 -apple-system, sans-serif;
    padding: 9px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--ink); cursor: pointer; }
  .cand { margin-bottom: 60px; }
  .cand-head { max-width: 940px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 6px; }
  .cand-head h2 { font-size: 24px; font-weight: 500; }
  .cand-head p { font-size: 14px; line-height: 1.55; color: var(--sec); }
  .cand-head p strong { color: var(--ink); font-weight: 500; }
  .frames { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .frame { width: 390px; }
  .anno { margin-top: 12px; display: flex; flex-direction: column; gap: 5px; }
  .anno h3 { font-size: 14px; font-weight: 600; }
  .anno h3 code { font: 500 11.5px ui-monospace, Menlo, monospace; color: var(--sec); margin-left: 6px; }
  .anno p { font-size: 13px; line-height: 1.5; color: var(--sec); }

  /* phone */
  .phone { background: var(--bg); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .gallery .phone { width: 390px; height: 844px; border: 1px solid var(--border); border-radius: 44px; }
  .bare .phone { width: var(--w, 390px); height: var(--h, 844px); }
  .statusbar { height: 52px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 34px 0; font-size: 15px; font-weight: 600; }
  .statusbar .right { font-size: 12px; letter-spacing: 2px; }

  .topbar .sp { flex: 1; }
  .tb-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
  .tb-link { color: var(--blue); font-size: calc(15px * var(--s)); font-weight: 500; min-height: 44px; padding: 0 8px; }
  .nav { height: 52px; flex: none; position: relative; display: flex; align-items: center; justify-content: center; padding: 0 16px; }
  .nav .title { font-size: calc(17px * var(--s)); font-weight: 600; }
  .nav .back { position: absolute; left: 14px; color: var(--blue); font-size: calc(17px * var(--s)); min-height: 44px; display: flex; align-items: center; gap: 4px; }
  .nav .right { position: absolute; right: 18px; color: var(--blue); font-size: calc(17px * var(--s)); min-height: 44px; display: flex; align-items: center; }
  .scroll { flex: 1; overflow: hidden; padding: 0 24px 16px; display: flex; flex-direction: column; }
  .tabs { display: flex; gap: 22px; padding: 0 24px; border-bottom: 0.5px solid var(--border); flex: none; }

  .tab.on { color: var(--ink); font-weight: 500; box-shadow: inset 0 -2px 0 var(--blue); }
  .tab small { font-size: calc(12px * var(--s)); color: var(--sec); margin-left: 3px; }

  .search { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; flex: none; }
  .field { flex: 1; min-height: 40px; border-radius: 10px; background: var(--muted-bg); display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: calc(16px * var(--s)); color: var(--sec); }
  .field .q { color: var(--ink); }
  .field .caret { display: inline-block; width: 1.5px; height: 1.15em; background: var(--blue); vertical-align: -3px; margin-left: 1px; }

  .cancel { color: var(--blue); font-size: calc(16px * var(--s)); min-height: 44px; }

  .sect { display: flex; align-items: baseline; justify-content: space-between; margin: 10px 0 2px; }

  .sect .more { color: var(--blue); font-size: calc(13px * var(--s)); font-weight: 500; min-height: 36px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 18px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 0.7px solid var(--border); font-size: calc(14px * var(--s)); color: var(--ink); max-width: 100%; text-align: left; }
  .chip small { color: var(--sec); font-size: calc(12px * var(--s)); }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }

  .seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 16px; flex: none; }
  .seg .chip { flex: none; }

  .trow { display: flex; align-items: flex-start; gap: 6px; padding: 9px 0; border-bottom: 0.5px solid var(--border); }
  .circle { width: 44px; height: 44px; margin: -10px 0 -10px -11px; flex: none; display: flex; align-items: center; justify-content: center; }

  .meta .srcl { text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: calc(12.5px * var(--s)); color: var(--sec); line-height: 1.35; }
  .mpill { background: var(--muted-bg); color: var(--sec); border-radius: 5px; padding: 1px 6px; font-size: calc(11.5px * var(--s)); }
  .mpill.blue { background: var(--pill-bg); color: var(--pill-text); }
  .dots { width: 44px; height: 44px; margin: -8px -12px -8px 0; flex: none; color: var(--sec); display: flex; align-items: center; justify-content: center; font-size: 18px; letter-spacing: 1px; }

  .nrow { display: flex; flex-direction: column; gap: 5px; padding: 13px 0; border-bottom: 0.5px solid var(--border); text-align: left; width: 100%; }
  .nrow .top { display: flex; align-items: baseline; gap: 10px; }
  .nrow .ntitle { font-size: calc(17px * var(--s)); font-weight: 500; flex: 1; min-width: 0; }
  .nrow .when { font-size: calc(13px * var(--s)); color: var(--sec); flex: none; }
  .nrow .ex { font-size: calc(14px * var(--s)); line-height: 1.45; color: var(--sec); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .nrow .ex.said { color: var(--ink); opacity: 0.86; }
  .nrow .about { font-size: calc(12.5px * var(--s)); color: var(--sec); }
  .nrow .tcount { font-size: calc(12.5px * var(--s)); color: var(--sec); }
  mark { background: var(--pill-bg); color: var(--pill-text); border-radius: 3px; padding: 0 1px; font-weight: 500; }

  .irow { display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 0.5px solid var(--border); width: 100%; text-align: left; }
  .irow .lbl { font-size: calc(17px * var(--s)); flex: 1; min-width: 0; }
  .irow .cnt { font-size: calc(14px * var(--s)); color: var(--sec); }
  .irow .sub { font-size: calc(12.5px * var(--s)); color: var(--sec); display: block; margin-top: 2px; }
  .chev { color: var(--sec); flex: none; }

  .ptitle { font-size: calc(28px * var(--s)); font-weight: 500; letter-spacing: -0.01em; line-height: 1.15; margin: 6px 0 6px; }
  .psub { font-size: calc(14px * var(--s)); color: var(--sec); line-height: 1.45; margin-bottom: 14px; }
  .links { font-size: calc(14px * var(--s)); color: var(--sec); line-height: 1.5; margin: 2px 0 14px; }
  .links a { color: var(--blue); text-decoration: none; font-weight: 500; }
  .said-row { padding: 12px 0; border-bottom: 0.5px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
  .said-row .src { font-size: calc(12.5px * var(--s)); color: var(--blue); font-weight: 500; min-height: 22px; text-align: left; }
  .said-row q { font-size: calc(15px * var(--s)); line-height: 1.45; quotes: "\201C" "\201D"; }

  .empty { margin: 28px 4px 0; display: flex; flex-direction: column; gap: 10px; }
  .empty h3 { font-size: calc(20px * var(--s)); font-weight: 500; line-height: 1.25; }
  .empty p { font-size: calc(15px * var(--s)); color: var(--sec); line-height: 1.5; }
  .empty .line { width: 34px; height: 3px; background: var(--blue); border-radius: 2px; margin-bottom: 6px; }

  .rec { flex: none; padding: 10px 24px 30px; display: flex; flex-direction: column; gap: 9px; border-top: 0.5px solid var(--border); background: var(--bg); }
  .rec-btn { width: 100%; height: 64px; border-radius: 8px; color: #fff; background: linear-gradient(150deg, var(--blue-lifted), #2563EB 62%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: calc(15px * var(--s)); font-weight: 500; }
  .rec-mark { display: flex; gap: 10px; } .rec-mark i { width: 26px; height: 3px; background: #fff; border-radius: 2px; }
  .kbd { flex: none; height: 291px; background: var(--kbd); padding: 8px 4px 40px; display: grid; grid-template-rows: repeat(4, 1fr); gap: 11px; }
  .kbd div { display: flex; gap: 6px; justify-content: center; }
  .kbd span { background: var(--key); border-radius: 5px; flex: 0 0 32px; box-shadow: 0 1px 0 rgba(0,0,0,0.25); }
  .kbd .wide { flex: 0 0 186px; } .kbd .mid { flex: 0 0 86px; }

  /* sheet */
  .scrim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet { position: absolute; left: 0; right: 0; top: 58px; bottom: 0; background: var(--bg); border-radius: 14px 14px 0 0; display: flex; flex-direction: column; }
  .sh-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
  .sh-head .pillbtn { min-height: 44px; padding: 0 16px; border-radius: 22px; background: var(--muted-bg); font-size: calc(15px * var(--s)); }
  .sh-head .ttl { font-size: calc(16px * var(--s)); font-weight: 600; }
  .sh-body { flex: 1; overflow: hidden; padding: 6px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
  .sh-body h2 { font-size: calc(24px * var(--s)); font-weight: 500; line-height: 1.2; }
  .sh-body .prose { font-size: calc(15px * var(--s)); line-height: 1.5; color: var(--sec); }
  .aboutrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .aboutrow .chip { min-height: 34px; }
  .mini { display: flex; gap: 12px; align-items: center; font-size: calc(15px * var(--s)); min-height: 30px; }
  .mini i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--sec); flex: none; }
  .form-sect { display: flex; flex-direction: column; border-top: 0.5px solid var(--border); }
  .frow { display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 0.5px solid var(--border); }
  .frow .lbl { flex: 1; font-size: calc(16px * var(--s)); }
  .frow .lbl small { display: block; font-size: calc(12.5px * var(--s)); color: var(--sec); margin-top: 2px; }
  .frow .act { color: var(--danger); font-size: calc(15px * var(--s)); min-height: 44px; padding: 0 2px; }
  .frow.removed .lbl { color: var(--sec); }
  .frow.removed .lbl s { text-decoration-color: var(--sec); }
  .frow .undo { color: var(--blue); font-size: calc(15px * var(--s)); font-weight: 500; min-height: 44px; }
  .foot { font-size: calc(13px * var(--s)); color: var(--sec); line-height: 1.45; }
  .ghost { opacity: 0.45; }
  .fieldbox { border: 0.7px solid var(--border); border-radius: 8px; padding: 11px 12px; font-size: calc(15px * var(--s)); }
</style>
</head>

<button class="theme-toggle" id="themeToggle" hidden>Dark</button>
<div id="root"></div>
<script>
const P = new URLSearchParams(location.search);
const ONLY = P.get('only');
const AX = P.get('ax') === '1';
document.documentElement.dataset.theme = P.get('theme') === 'dark' ? 'dark' : 'light';
if (AX) document.body.classList.add('ax');
if (P.get('w')) document.documentElement.style.setProperty('--w', P.get('w') + 'px');
if (P.get('h')) document.documentElement.style.setProperty('--h', P.get('h') + 'px');

/* ---------- synthetic data (no real notes) ---------- */
// "Today" in these mocks is Monday, October 5. Labels are what extraction already returns:
// people, projects and topic tags (A, B) or the five life areas (C). A topic that repeats a
// named project or person in the same note is shown once, as the named one.
const NOTES = [
  { id: 'n1', title: 'drive in', type: 'freeform', when: '8:15 AM', group: 'today', full: 'Mon, Oct 5 at 8:15 AM',

    said: 'get the pricing page copy done before the launch email goes out, and ask Sam about the annual plan',
    people: ['Sam'], projects: ['pricing page', 'launch email'], tags: [], areas: ['work'],
    todos: [{ t: 'Draft the pricing page copy', p: 'today' }, { t: 'Ask Sam about the annual plan', p: 'today' }] },
  { id: 'n2', title: 'morning walk', type: 'morning', when: '7:42 AM', group: 'today', full: 'Mon, Oct 5 at 7:42 AM',
    summary: 'The dentist this week, call Mom about Sunday dinner, a slower start.',
    said: 'I need to call Mom about Sunday dinner, and get the dentist booked this week',
    people: ['Mom'], projects: ['Sunday dinner'], tags: ['dentist', 'health', 'family'], areas: ['health', 'relationships'],
    todos: [{ t: 'Book the dentist', p: 'this week' }, { t: 'Call Mom about Sunday dinner', p: 'today' }] },
  { id: 'n3', title: 'drive home', type: 'evening', when: 'Fri 6:10 PM', group: 'last week', full: 'Fri, Oct 2 at 6:10 PM',
    summary: 'The launch email is close. Marcus wants the numbers by Wednesday.',
    said: 'the launch email is close, one more read, and Marcus wants the numbers by Wednesday',
    people: ['Marcus'], projects: ['launch email', 'metrics doc'], tags: ['numbers'], areas: ['work'],
    todos: [{ t: 'Send Marcus the metrics doc', p: 'done', done: true }, { t: 'Final read of the launch email', p: 'today' }] },
  { id: 'n4', title: 'Sat walk', type: 'freeform', when: 'Sep 26', group: 'september', full: 'Sat, Sep 26 at 10:05 AM',
    summary: 'Garage shelves and the pottery course, whenever.',
    said: 'at some point the garage shelves, and look at that pottery course',
    people: [], projects: ['garage shelves', 'pottery course'], tags: ['home'], areas: ['passions'],
    todos: [{ t: 'Measure the garage wall', p: 'later' }, { t: 'Look up the pottery course', p: 'later' }] },
  { id: 'n5', title: 'lunch walk', type: 'freeform', when: 'Sep 24', group: 'september', full: 'Thu, Sep 24 at 12:20 PM',
    summary: 'The pricing tiers feel wrong; three is too many. Keep the free plan.',
    said: 'the pricing tiers feel wrong, three is too many, but keep the free plan',

  { id: 'n6', title: 'evening', type: 'evening', when: 'Sep 22', group: 'september', full: 'Tue, Sep 22 at 9:02 PM',
    summary: 'Ran 5k and the knee felt fine. Physical therapy on Thursday.',
    said: 'ran the 5k, knee felt fine, physical therapy is Thursday',
    people: [], projects: ['physical therapy'], tags: ['running', 'health'], areas: ['health'],
    todos: [{ t: 'Confirm physical therapy Thursday', p: 'done', done: true }] },
  { id: 'n7', title: 'drive in', type: 'morning', when: 'Sep 18', group: 'september', full: 'Fri, Sep 18 at 8:20 AM',
    summary: 'Sam needs the deck by Friday. Boston in October.',
    said: 'Sam needs the deck by Friday, and Boston is in October',
    people: ['Sam'], projects: ['deck', 'Boston trip'], tags: ['travel'], areas: ['work'],
    todos: [{ t: 'Send Sam the revised deck', p: 'done', done: true }, { t: 'Book the Boston train', p: 'later' }] },
  { id: 'n8', title: 'weekly review', type: 'weekly review', when: 'Sep 13', group: 'september', full: 'Sun, Sep 13 at 7:30 PM',
    summary: 'A good week for writing. Too many meetings. Protect the mornings.',
    said: 'good week for writing, too many meetings, protect the mornings',
    people: [], projects: [], tags: ['writing', 'mornings'], areas: ['work', 'purpose'],
    todos: [{ t: 'Block mornings for writing', p: 'today' }] },
  { id: 'n9', title: 'walk with Mom', type: 'freeform', when: 'Sep 6', group: 'september', full: 'Sun, Sep 6 at 5:40 PM',
    summary: "Mom's birthday is in November. She'd like a photo book.",

    todos: [{ t: 'Start the photo book for Mom', p: 'later' }] },
  { id: 'n10', title: 'errands', type: 'freeform', when: 'Aug 21', group: 'august', full: 'Fri, Aug 21 at 5:30 PM',
    summary: 'The lease message and the library books.',
    said: 'email the landlord about the lease, and the library books are due',
    people: [], projects: ['lease'], tags: ['errands', 'home'], areas: [],
    todos: [{ t: 'Email the landlord about the lease', p: 'today' }, { t: 'Return the library books', p: 'today' }] },
];
const N = Object.fromEntries(NOTES.map(n => [n.id, n]));
const labelsOf = n => [...n.people, ...n.projects, ...n.tags];
const AREAS = ['work', 'health', 'relationships', 'passions', 'purpose'];
function repeated(kind) {
  const c = {};
  NOTES.forEach(n => n[kind].forEach(l => { c[l] = (c[l] || []).concat(n.id); }));
  return Object.entries(c).filter(([, ids]) => ids.length >= 2).map(([l, ids]) => ({ l, ids }));
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(text, q) {
  if (!q) return esc(text);
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return esc(text).replace(re, '<mark>$1</mark>');

function matches(q) {

  document.getElementById('root').innerHTML = FRAMES[ONLY].html;
} else {
  document.body.className = 'gallery' + (AX ? ' ax' : '');
  const t = document.getElementById('themeToggle'); t.hidden = false;
  t.textContent = document.documentElement.dataset.theme === 'dark' ? 'Light' : 'Dark';
  t.onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; t.textContent = d.dataset.theme === 'dark' ? 'Light' : 'Dark'; };
  let html = `<header class="masthead"><span class="eyebrow">TL-KNOW-001 · design candidates · awaiting Mike’s selection</span><h1>Categories and search</h1>
    <p>Old notes are hard to get back to. Notes is one long chronological list with no search and no dates on its cards. Your agent can already search your notes; you can’t. Three different answers below, built only from what extraction already returns. Synthetic content throughout; nothing here is selected.</p></header>`;
  html += `<section class="doc"><h2>Current flow · simulator, synthetic data, source 8b30dd8 (app source identical to submitted d7f2676)</h2><div class="current">
    <figure><img src="current/today-light-sim.png" alt="Home running list, today tab"><figcaption>Home: the running list. “notes” is the only way to older notes.</figcaption></figure>
    <figure><img src="current/notes-light-sim.png" alt="Notes list"><figcaption>Notes: full cards, newest first. No search, no grouping; the eyebrow shows only the time.</figcaption></figure>
    <figure><img src="current/source-light-sim.png" alt="Note detail sheet"><figcaption>Note sheet: people, projects and topics are extracted but never shown.</figcaption></figure></div></section>`;
  html += `<section class="doc"><h2>Rules every candidate keeps</h2><ul>
    <li><strong>No new extraction.</strong> Categories use fields the extractor already returns for every note (people, projects, topic tags and five life areas). No prompt, schema, provider or model change.</li>
    <li><strong>Grounded and traceable.</strong> Every category view shows where you said it. A topic that repeats a named project or person in the same note is shown once, as the named one.</li>
    <li><strong>To-dos belong to their note.</strong> A to-do is found by its own words and inherits its note’s categories. In results it is the same row as the running list: completion, ••• and the source label all work.</li>
    <li><strong>One search, on the phone.</strong> Titles, summaries, what you said, labels and to-dos (open and done), across every cached note. It keeps working offline. Query text and label names never go to analytics.</li>
    <li><strong>Correction is easy and durable.</strong> Removing a label is a button in Edit, not a gesture, and your agent sees the same result. No manual tagging, renaming or merging in this slice.</li>
    <li><strong>Unchanged:</strong> the running list, capture tray, recorder, AI controls, note sheet sections and grading.</li></ul></section>`;
  ['a', 'b', 'c', 's'].forEach(c => {
    html += `<section class="cand"><div class="cand-head"><h2>${CANDS[c].name}</h2><p>${CANDS[c].idea}</p>${CANDS[c].what ? `<p><strong>${CANDS[c].what}</strong></p>` : ''}</div><div class="frames">`;
    Object.entries(FRAMES).filter(([, f]) => f.c === c).forEach(([id, f]) => {
      html += `<div class="frame">${f.html}<div class="anno"><h3>${f.t}<code>${id}</code></h3><p>${f.d}</p></div></div>`;
    });
    html += '</div></section>';
  });
  document.getElementById('root').innerHTML = html;
}
</script>
</body>
</html>
